<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What is Your True Mental Age? - Fun Quiz</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Discover your true mental age with this fun dynamic quiz! Answer 5 quick questions and share your result with friends.">
    <meta name="keywords" content="mental age quiz, personality quiz, fun test, age calculator, viral quiz">
    <meta name="robots" content="index, follow">

    <!-- Open Graph Meta Tags for Social Media Previews -->
    <meta property="og:title" content="What is Your True Mental Age? - Fun Quiz">
    <meta property="og:description" content="Discover your true mental age with this fun dynamic quiz! Answer 5 quick questions and share your results with friends.">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#14213D',
                        cream: '#F4EDE0',
                        coral: '#FF6B5B'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy min-h-screen flex items-center justify-center p-4 text-cream font-sans">

    <div class="bg-white/5 backdrop-blur-lg p-6 rounded-2xl shadow-2xl max-w-md w-full text-center border border-white/10">
        <h1 class="text-2xl font-bold mb-4 text-coral">🧠 Mental Age Quiz</h1>
        
        <!-- Direct Quiz Container -->
        <div id="quiz-container">
            <!-- Questions will load here automatically -->
        </div>
    </div>

    <script>
        const allQuestions = [
            {
                question: "Q: What is your ideal weekend plan?",
                options: [
                    { text: "Sleeping early & relaxing 🛌", score: 25 },
                    { text: "Gaming or watching movies all night 🎮", score: 15 },
                    { text: "Partying with friends 🎉", score: 10 }
                ]
            },
            {
                question: "Q: How do you react when you see a spooky movie?",
                options: [
                    { text: "Laugh because it's fake 😂", score: 10 },
                    { text: "Cover my eyes with a pillow 🙈", score: 20 },
                    { text: "Sleep with the lights on 💡", score: 30 }
                ]
            },
            {
                question: "Q: Choose your favorite snack:",
                options: [
                    { text: "Healthy salad or green tea 🥗", score: 28 },
                    { text: "Pizza & Burgers 🍕", score: 15 },
                    { text: "Ice cream & Chocolates 🍫", score: 10 }
                ]
            },
            {
                question: "Q: How do you handle your smartphone battery?",
                options: [
                    { text: "Charge it only when it dies completely 📴", score: 12 },
                    { text: "Plug it in whenever it hits 50% 🔋", score: 26 },
                    { text: "Keep it on charger all day long 🔌", score: 18 }
                ]
            },
            {
                question: "Q: What is your shopping habit?",
                options: [
                    { text: "Buy only what is strictly necessary 🛒", score: 30 },
                    { text: "Spend half salary on cool gadgets 📱", score: 14 },
                    { text: "Buy things just because they look cute 😍", score: 10 }
                ]
            },
            {
                question: "Q: How do you wake up in the morning?",
                options: [
                    { text: "Wake up before the alarm rings 🌅", score: 30 },
                    { text: "Snooze alarm 5 times ⏰", score: 15 },
                    { text: "Ignore alarm and keep sleeping 😴", score: 10 }
                ]
            },
            {
                question: "Q: What do you do when you lose your keys?",
                options: [
                    { text: "Calmly retrace my steps 🧘‍♂️", score: 25 },
                    { text: "Search everywhere while panicking 🏃‍♂️", score: 15 },
                    { text: "Blame everyone else in the house 🤷‍♂️", score: 10 }
                ]
            },
            {
                question: "Q: How do you deal with a long text message?",
                options: [
                    { text: "Read every word carefully 📖", score: 25 },
                    { text: "Skim it quickly and reply in short ⚡", score: 18 },
                    { text: "Ignore it and send a voice note later 🎤", score: 12 }
                ]
            }
        ];

        let quizQuestions = [];
        let currentQuestion = 0;
        let totalScore = 0;
        let finalMentalAge = 0;

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startQuiz() {
            quizQuestions = shuffleArray([...allQuestions]).slice(0, 5);
            currentQuestion = 0;
            totalScore = 0;
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestion < quizQuestions.length) {
                let q = quizQuestions[currentQuestion];
                let optionsHTML = '';
                let shuffledOptions = shuffleArray([...q.options]);

                shuffledOptions.forEach((opt) => {
                    optionsHTML += `<button onclick="selectOption(${opt.score})" class="bg-navy border border-coral/40 hover:bg-coral hover:text-navy text-cream font-medium w-full py-3 px-4 rounded-xl transition duration-200 shadow-md">${opt.text}</button>`;
                });

                document.getElementById('quiz-container').innerHTML = `
                    <p class="text-xs text-coral font-semibold mb-2">Question ${currentQuestion + 1} of ${quizQuestions.length}</p>
                    <h2 class="text-lg font-semibold mb-5 text-cream">${q.question}</h2>
                    <div class="space-y-3">
                        ${optionsHTML}
                    </div>
                `;
            } else {
                showResult();
            }
        }

        function selectOption(score) {
            totalScore += score;
            currentQuestion++;
            showQuestion();
        }

        function showResult() {
            finalMentalAge = Math.floor(totalScore / 5) + 12;
            if(finalMentalAge > 45) finalMentalAge = 38;

            let message = `OMG! My True Mental Age is ${finalMentalAge} Years Old! 😎 Check yours here: ` + window.location.href;
            let whatsappURL = `https://wa.me/?text=` + encodeURIComponent(message);

            document.getElementById('quiz-container').innerHTML = `
                <h2 class="text-2xl font-bold text-coral mb-2">Quiz Completed! 🎉</h2>
                <p class="text-cream/80 mb-4 text-sm">Based on your unique choices...</p>
                <div class="bg-white/10 p-4 rounded-xl mb-5 border border-white/10">
                    <p class="text-sm text-cream/70">Your True Mental Age is:</p>
                    <p class="text-3xl font-extrabold text-coral mt-1">${finalMentalAge} Years Old! 😎</p>
                </div>
                
                <a href="${whatsappURL}" target="_blank" class="block bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-full w-full shadow-lg transition duration-300 mb-3 text-center">
                    Share on WhatsApp 🟢
                </a>

                <button onclick="startQuiz()" class="bg-coral hover:opacity-90 text-navy font-bold py-3 px-6 rounded-full w-full shadow-lg transition duration-300">
                    Play Again 🔄
                </button>
            `;
        }

        startQuiz();
    </script>
</body>
</html>
