<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What is Your True Mental Age? - Fun Quiz</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 to-purple-800 min-h-screen flex items-center justify-center p-4 text-white font-sans">

    <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl shadow-2xl max-w-md w-full text-center border border-white/20">
        <h1 class="text-2xl font-bold mb-4 text-yellow-300">🧠 Mental Age Quiz</h1>
        
        <!-- Direct Quiz Container -->
        <div id="quiz-container">
            <!-- Questions will load here automatically -->
        </div>
    </div>

    <script>
        const allQuestions = [
            {
                question: "Q: What is your ideal weekend plan?",
                options: [
                    { text: "Sleeping early & relaxing 🛌", score: 25 },
                    { text: "Gaming or watching movies all night 🎮", score: 15 },
                    { text: "Partying with friends 🎉", score: 10 }
                ]
            },
            {
                question: "Q: How do you react when you see a spooky movie?",
                options: [
                    { text: "Laugh because it's fake 😂", score: 10 },
                    { text: "Cover my eyes with a pillow 🙈", score: 20 },
                    { text: "Sleep with the lights on 💡", score: 30 }
                ]
            },
            {
                question: "Q: Choose your favorite snack:",
                options: [
                    { text: "Healthy salad or green tea 🥗", score: 28 },
                    { text: "Pizza & Burgers 🍕", score: 15 },
                    { text: "Ice cream & Chocolates 🍫", score: 10 }
                ]
            },
            {
                question: "Q: How do you handle your smartphone battery?",
                options: [
                    { text: "Charge it only when it dies completely 📴", score: 12 },
                    { text: "Plug it in whenever it hits 50% 🔋", score: 26 },
                    { text: "Keep it on charger all day long 🔌", score: 18 }
                ]
            },
            {
                question: "Q: What is your shopping habit?",
                options: [
                    { text: "Buy only what is strictly necessary 🛒", score: 30 },
                    { text: "Spend half salary on cool gadgets 📱", score: 14 },
                    { text: "Buy things just because they look cute 😍", score: 10 }
                ]
            },
            {
                question: "Q: How do you wake up in the morning?",
                options: [
                    { text: "Wake up before the alarm rings 🌅", score: 30 },
                    { text: "Snooze alarm 5 times ⏰", score: 15 },
                    { text: "Ignore alarm and keep sleeping 😴", score: 10 }
                ]
            },
            {
                question: "Q: What do you do when you lose your keys?",
                options: [
                    { text: "Calmly retrace my steps 🧘‍♂️", score: 25 },
                    { text: "Search everywhere while panicking 🏃‍♂️", score: 15 },
                    { text: "Blame everyone else in the house 🤷‍♂️", score: 10 }
                ]
            },
            {
                question: "Q: How do you deal with a long text message?",
                options: [
                    { text: "Read every word carefully 📖", score: 25 },
                    { text: "Skim it quickly and reply in short ⚡", score: 18 },
                    { text: "Ignore it and send a voice note later 🎤", score: 12 }
                ]
            }
        ];

        let quizQuestions = [];
        let currentQuestion = 0;
        let totalScore = 0;
        let finalMentalAge = 0;

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startQuiz() {
            quizQuestions = shuffleArray([...allQuestions]).slice(0, 5);
            currentQuestion = 0;
            totalScore = 0;
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestion < quizQuestions.length) {
                let q = quizQuestions[currentQuestion];
                let optionsHTML = '';
                let shuffledOptions = shuffleArray([...q.options]);

                shuffledOptions.forEach((opt) => {
                    optionsHTML += `<button onclick="selectOption(${opt.score})" class="bg-purple-600 hover:bg-purple-700 text-white font-medium w-full py-3 px-4 rounded-xl transition duration-200 shadow-md">${opt.text}</button>`;
                });

                document.getElementById('quiz-container').innerHTML = `
                    <p class="text-xs text-yellow-300 font-semibold mb-2">Question ${currentQuestion + 1} of ${quizQuestions.length}</p>
                    <h2 class="text-lg font-semibold mb-5 text-gray-100">${q.question}</h2>
                    <div class="space-y-3">
                        ${optionsHTML}
                    </div>
                `;
            } else {
                showResult();
            }
        }

        function selectOption(score) {
            totalScore += score;
            currentQuestion++;
            showQuestion();
        }

        function showResult() {
            finalMentalAge = Math.floor(totalScore / 5) + 12;
            if(finalMentalAge > 45) finalMentalAge = 38;

            // 100% Pure English Share Message Format
            let message = `OMG! My True Mental Age is ${finalMentalAge} Years Old! 😎 Check yours here: ` + window.location.href;
            let whatsappURL = `https://wa.me/?text=` + encodeURIComponent(message);

            document.getElementById('quiz-container').innerHTML = `
                <h2 class="text-2xl font-bold text-green-300 mb-2">Quiz Completed! 🎉</h2>
                <p class="text-gray-200 mb-4 text-sm">Based on your unique choices...</p>
                <div class="bg-white/20 p-4 rounded-xl mb-5 border border-white/10">
                    <p class="text-sm text-gray-300">Your True Mental Age is:</p>
                    <p class="text-3xl font-extrabold text-yellow-400 mt-1">${finalMentalAge} Years Old! 😎</p>
                </div>
                
                <a href="${whatsappURL}" target="_blank" class="block bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full w-full shadow-lg transition duration-300 mb-3 text-center">
                    Share on WhatsApp 🟢
                </a>

                <button onclick="startQuiz()" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-6 rounded-full w-full shadow-lg transition duration-300">
                    Play Again 🔄
                </button>
            `;
        }

        // Initialize quiz on load
        startQuiz();
    </script>
</body>
</html>
