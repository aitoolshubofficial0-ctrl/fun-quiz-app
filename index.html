<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What is Your True Mental Age? - Fun Quiz</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 to-purple-800 min-h-screen flex items-center justify-center p-4 text-white">

    <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl shadow-2xl max-w-md w-full text-center border border-white/20">
        <h1 class="text-3xl font-bold mb-4 text-yellow-300">🧠 Mental Age Quiz</h1>
        <p class="text-gray-200 mb-6">Find out your true mental age based on your daily habits and choices!</p>
        
        <div id="quiz-box">
            <button onclick="startQuiz()" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-6 rounded-full w-full shadow-lg transition duration-300">
                Start Quiz Now 🚀
            </button>
        </div>
    </div>

    <script>
        function startQuiz() {
            document.getElementById('quiz-box').innerHTML = `
                <p class="text-lg font-semibold mb-4">Question 1: What do you prefer on a weekend night?</p>
                <div class="space-y-3">
                    <button onclick="nextQ(2)" class="bg-purple-600 hover:bg-purple-700 w-full py-2 rounded-lg">Sleeping early & relaxing 🛌</button>
                    <button onclick="nextQ(1)" class="bg-purple-600 hover:bg-purple-700 w-full py-2 rounded-lg">Gaming or watching movies all night 🎮</button>
                </div>
            `;
        }

        function nextQ(score) {
            document.getElementById('quiz-box').innerHTML = `
                <h2 class="text-2xl font-bold text-green-300 mb-2">Quiz Completed! 🎉</h2>
                <p class="text-gray-200 mb-4">Calculating your results...</p>
                <div class="text-xl font-bold text-yellow-400">Your Mental Age is: 24 Years Old! 😎</div>
                <button onclick="location.reload()" class="mt-6 bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded-full w-full">Try Again</button>
            `;
        }
    </script>

</body>
</html>
